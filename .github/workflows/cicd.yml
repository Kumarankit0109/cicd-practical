name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-docker-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: echo "Build successful"

    - name: Docker Build
      run: docker build -t cicd-app .

    - name: Deploy
      run: echo "Deployment successful"